name: Check OpenCode plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        opencode: ["1.15.11", "1.18.35"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check generated standalone plugin
        run: git diff --exit-code -- assets/opencode/plugins/render.ts
      - name: Install OpenCode CLI
        run: npm install --prefix "$RUNNER_TEMP/opencode-cli" --no-audit --no-fund "opencode-ai@${{ matrix.opencode }}"
      - name: Test packed npm package and GitHub installer in OpenCode
        run: npm run test:integration
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode-cli/node_modules/.bin/opencode
